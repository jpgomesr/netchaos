name: Use-case scenario
description: Describe a real resilience-testing scenario that's hard to test today, to help validate netchaos's scope.
labels: ["use-case"]
body:
  - type: markdown
    attributes:
      value: |
        Concrete scenarios are the most useful input there is — they show whether the
        [shipped scope](https://github.com/jpgomesr/netchaos/blob/main/docs/06-scope-and-roadmap.md) covers the cases
        people actually need, and the two post-v1 questions still open (reordering, per-peer-pair fault scoping) are
        gated on exactly this kind of real usage evidence.

        Use this form to describe the problem. If you already know what netchaos should add, use
        [enhancement](https://github.com/jpgomesr/netchaos/issues/new?template=enhancement.yml) instead.

  - type: textarea
    id: scenario
    attributes:
      label: What are you trying to test?
      description: e.g. a retry policy, a circuit breaker, a specific timeout behavior.
    validations:
      required: true

  - type: textarea
    id: why-hard
    attributes:
      label: Why is this hard to test today?
      description: What do you currently have to do (external proxy, manual fault injection, skip the test entirely)?
    validations:
      required: true

  - type: textarea
    id: fault-types
    attributes:
      label: What fault types would you need?
      description: Latency, packet loss, partition, reordering, etc.
