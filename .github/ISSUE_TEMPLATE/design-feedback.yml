name: Design feedback
description: Feedback on netchaos's API, architecture, or scope — the design itself, not a defect in it.
labels: ["design"]
body:
  - type: markdown
    attributes:
      value: |
        v1 is implemented and released as `v0.1.0` — see
        [docs/](https://github.com/jpgomesr/netchaos/blob/main/docs/README.md) for the design set that describes it.
        The API is stable but not frozen until `v1.0.0`, so naming and ergonomics feedback is most useful now, while
        there is still room to act on it.

        This form is for the design itself. If netchaos behaves differently from a real `net.Conn` in a way the docs
        don't describe, that's a [bug report](https://github.com/jpgomesr/netchaos/issues/new?template=bug.yml); if you
        want it to do something new, that's an
        [enhancement](https://github.com/jpgomesr/netchaos/issues/new?template=enhancement.yml).

  - type: dropdown
    id: doc
    attributes:
      label: Which design doc does this relate to?
      options:
        - "01 - Vision"
        - "02 - Comparison"
        - "03 - Architecture"
        - "04 - API Design"
        - "05 - Fault Injection"
        - "06 - Scope & Roadmap"
        - "07 - Contributing"
        - "Root README"
        - "Other / not sure"
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: What feels off, missing, or worth reconsidering? Concrete examples help.
    validations:
      required: true
