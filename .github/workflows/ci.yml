name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a new Go release or a runner-image change that breaks the
  # build shows up between pushes, not on the next unrelated PR.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Never let the go command download a newer toolchain: the 1.25 leg must
# run on Go 1.25 itself, so a dependency bump that raises the module's go
# line fails CI here instead of silently dropping Go 1.25 support (#110).
env:
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      matrix:
        go-version: ["1.25", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Cross-build
        if: matrix.go-version == 'stable'
        run: |
          for target in plan9/amd64 windows/amd64 darwin/arm64 freebsd/amd64 js/wasm wasip1/wasm; do
            echo "GOOS=${target%/*} GOARCH=${target#*/}"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./...
          done

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      # The nettest conformance suite lives in its own module so that
      # golang.org/x/net is never a requirement of the library (#110). Only
      # on stable: x/net may require a newer Go than the library's floor.
      - name: Conformance (nettest)
        if: matrix.go-version == 'stable'
        working-directory: internal/conformance
        run: |
          go vet ./...
          go test -race ./...

      - name: 32-bit (GOARCH=386)
        if: matrix.go-version == 'stable'
        env:
          GOARCH: "386"
        run: |
          go vet ./...
          go test ./...

      - name: Coverage
        if: matrix.go-version == 'stable'
        run: |
          go test -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tail -1

      - name: Fuzz
        if: matrix.go-version == 'stable'
        run: go test -run=^$ -fuzz=FuzzPipeAccounting -fuzztime=20s ./...

  # Build, vet and test natively on macOS and Windows, on stable only; the
  # Linux job above keeps the Go 1.25 floor, 32-bit, coverage and fuzz
  # steps. Cross-building alone only proves these platforms compile.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
