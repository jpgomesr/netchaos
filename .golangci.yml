version: "2"

linters:
  default: standard
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - revive
    - misspell
    - godot
  exclusions:
    rules:
      # min/max as parameter names (WithLatency, SetLatency,
      # validateLatencyRange, uniformDuration) are frozen, documented public
      # API and long-established internal convention -- not a defect, and
      # renaming WithLatency's parameters would be a breaking change to a
      # v1.0.0-compatibility surface. See docs/04-api-design.md.
      - linters:
          - revive
        text: "redefines-builtin-id"

formatters:
  enable:
    - gofmt
    - goimports
